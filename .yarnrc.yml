nodeLinker: node-modules
enableScripts: false
# Ignore npm versions published less than 7 days ago
npmMinimalAgeGate: 10080
# Our npm scope holds only dev-time tooling (eslint-config, webpack-config), which is published
# by hand and needed immediately, so exempt it from the cooldown above
npmScopes:
  silverstripe:
    npmMinimalAgeGate: 0
